# Local development only: isolated volumes, loopback bindings, public example credentials.
# Stop with `docker compose stop`; `down` preserves data unless --volumes is explicitly used.
name: sap-program-manager
services:
  postgres:
    image: postgres:16-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: sap_pm
      POSTGRES_USER: sap_pm
      POSTGRES_PASSWORD: sap-pm-local-only
    ports:
      - "127.0.0.1:55417:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap_pm -d sap_pm"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: sap-pm-local
      MINIO_ROOT_PASSWORD: sap-pm-local-storage-only
    ports:
      - "127.0.0.1:19017:9000"
      - "127.0.0.1:19018:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
  storage-data:
