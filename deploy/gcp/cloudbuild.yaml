steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "europe-west1-docker.pkg.dev/sap-solution-architect-demo/app/sap:${_TAG}", "."]
images:
  - europe-west1-docker.pkg.dev/sap-solution-architect-demo/app/sap:${_TAG}
serviceAccount: projects/sap-solution-architect-demo/serviceAccounts/sap-build@sap-solution-architect-demo.iam.gserviceaccount.com
substitutions:
  _TAG: latest
options:
  logging: CLOUD_LOGGING_ONLY
